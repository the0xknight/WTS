<!DOCTYPE html>
<html>
<title>SVG Animation</title>
<body>
<svg>
<circle cx="100" cy="100" r="50" style="fill: rgb(223, 26, 223); fill-opacity: .5; stroke:
black; stroke-width: 1.5;">
<animate
attributeName="r" attributeType="XML"
 from="30" to="50" begin="0s" dur="6s" fill="freeze" />
</circle>
</svg>
</body>
</html>
